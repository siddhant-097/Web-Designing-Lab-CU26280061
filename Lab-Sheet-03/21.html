<!DOCTYPE html>
<html>
<head>
    <title>Callback and setTimeout</title>
</head>
<body>

<h2>Callback Function</h2>

<p id="result">Waiting...</p>

<script>
    function performTask(callback) {

        setTimeout(function() {

            document.getElementById("result").innerHTML =
                "Task completed.";

            callback();

        }, 2000);
    }

    function showMessage() {

        document.getElementById("result").innerHTML +=
            "<br>Callback function executed.";

    }

    performTask(showMessage);
</script>

</body>
</html>
