<!DOCTYPE html>
<html>

<head>

</head>

<body>

    <h2>Student grade based on marks</h2>

    <input type="number" id="marks" placeholder="Enter marks">
    <button onclick=getGrade()>Check Grade</button>



    <script>
        function getGrade() {
            let marks = Number(document.getElementById("marks").value);
            let grade;

            if (marks >= 90) {
                grade = "A";
            } else if (marks >= 80) {
                grade = "B";
            } else if (marks >= 70) {
                grade = "C";
            } else if (marks >= 60) {
                grade = "D";
            } else {
                grade = "F";
            }
        }

    </script>
</body>

</html>
